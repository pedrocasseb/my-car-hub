version: '3.9'

services:
  postgres:
    image: postgres:17

    container_name: my-car-hub-db

    restart: always

    environment:
      POSTGRES_DB: mycarhub
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: